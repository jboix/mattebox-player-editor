version: 2
updates:
  # --- GitHub Actions ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      action-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # --- NPM ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    groups:
      node-dependencies:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]
    ignore:
      # @types/node majors track the Node major (.nvmrc); bump it only when
      # the supported runtime floor moves.
      - dependency-name: "@types/node"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "typescript"
        update-types: [ "version-update:semver-major" ]
      # The engine's range follows the player's peer range, a decision and
      # never a bot's; Monaco majors move its module layout, which
      # src/monaco.ts names file by file.
      - dependency-name: "mattebox"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "monaco-editor"
        update-types: [ "version-update:semver-major" ]
