<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mattebox player editor</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
  />
  <link rel="stylesheet" href="/src/style.css" />
  <script>
    // Before the first paint, so the page never flashes the other theme.
    try {
      const theme = localStorage.getItem('mattebox.editor.theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
</head>
<body>
  <header class="masthead">
    <img id="logo" class="logo" alt="">
    <h1>Mattebox player editor</h1>
    <div class="tools" role="toolbar" aria-label="Editor actions">
      <label class="field">
        <span>Preset</span>
        <select id="preset" aria-label="Preset"></select>
      </label>
      <label class="field">
        <span>Stream</span>
        <select id="stream" aria-label="Stream"></select>
      </label>
      <button type="button" id="theme-menu-button" class="menu-button" popovertarget="theme-menu">Theme</button>
      <div id="theme-menu" class="menu" popover role="menu" aria-labelledby="theme-menu-button">
        <button type="button" role="menuitem" id="copy-css">Copy theme.css</button>
        <button type="button" role="menuitem" id="copy-html">Copy player.html</button>
        <button type="button" role="menuitem" id="download">Download both files</button>
        <button type="button" role="menuitem" id="share">Copy a link to this theme</button>
        <hr>
        <button type="button" role="menuitem" id="reset" class="danger">Start over from the default…</button>
      </div>
      <button type="button" id="view-menu-button" class="menu-button" popovertarget="view-menu">View</button>
      <div id="view-menu" class="menu" popover role="menu" aria-labelledby="view-menu-button">
        <span class="menu-label" aria-hidden="true">Dock the preview</span>
        <button type="button" role="menuitemradio" data-dock="right" aria-checked="true">Right</button>
        <button type="button" role="menuitemradio" data-dock="left" aria-checked="false">Left</button>
        <button type="button" role="menuitemradio" data-dock="bottom" aria-checked="false">Bottom</button>
        <button type="button" role="menuitemradio" data-dock="top" aria-checked="false">Top</button>
        <hr>
        <button type="button" role="menuitemcheckbox" id="theme-toggle" aria-checked="false">Dark room</button>
      </div>
      <a class="github" href="https://github.com/jboix/mattebox-player-editor">
        <svg viewBox="0 0 16 16" role="img"><title>The repository on GitHub</title><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z" /></svg>
      </a>
    </div>
  </header>

  <main id="workbench">
    <mbe-split-view id="split" dock="right">
      <section slot="primary" class="pane" aria-label="Documents">
        <div id="tabs" class="tabs" role="tablist" aria-label="Documents">
          <button type="button" role="tab" data-tab="css">theme.css</button>
          <button type="button" role="tab" data-tab="html">player.html</button>
        </div>
        <mbe-code-editor id="editor"></mbe-code-editor>
      </section>
      <section slot="secondary" class="pane" aria-label="Preview">
        <div class="pane-head">
          <label class="field">
            <span>Shape</span>
            <select id="ratio" aria-label="The shape the preview holds the player to"></select>
          </label>
        </div>
        <mbe-preview id="preview"></mbe-preview>
        <div class="pane-foot">
          <h2>Preview</h2>
          <span id="player-size" class="state readout" aria-live="off"></span>
        </div>
      </section>
    </mbe-split-view>
  </main>

  <p id="status" class="status" aria-live="polite"></p>

  <dialog id="confirm" aria-labelledby="confirm-text">
    <form method="dialog">
      <p id="confirm-text"></p>
      <menu>
        <button type="submit" value="cancel">Cancel</button>
        <button type="submit" value="ok" class="accent">Continue</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
